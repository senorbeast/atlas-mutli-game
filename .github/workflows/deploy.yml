name: Build and Deploy atlas-multi-game App
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-image-tag.outputs.image_tag }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ghcr.io -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Set image tag
        id: set-image-tag
        run: |
          IMAGE_TAG="ghcr.io/${{ secrets.REGISTRY_USERNAME }}/atlas-multi-game:$(git rev-parse --short HEAD)"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build and tag Docker image
        run: docker build -t ${{ env.IMAGE_TAG }} .

      - name: Push Docker image
        run: docker push ${{ env.IMAGE_TAG }}

  update-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: senorbeast/gitops
          token: ${{ secrets.GITOPS_PAT }}
          ref: dev
          fetch-depth: 0

      - name: Update deployment image
        run: |
          sed -i "s|image: ghcr.io/senorbeast/atlas-multi-game:.*|image: ${{ needs.build-and-push.outputs.image_tag }}|" apps/atlas-multi-game/overlays/production/deployment-patch.yaml

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add apps/atlas-multi-game/overlays/production/deployment-patch.yaml
          git commit -m "Update atlas-multi-game image to ${{ needs.build-and-push.outputs.image_tag }}"
          git push origin dev
